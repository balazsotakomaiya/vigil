name: vigil
description: >-
  TanStack Query-inspired data fetching, caching, and mutation library for
  Flutter. Provides a mixin-based API with stale-while-revalidate, request
  deduplication, garbage collection, and optimistic updates.
version: 0.1.0
homepage: https://github.com/balazsotakomaiya/vigil

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

